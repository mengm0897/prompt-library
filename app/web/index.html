<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8fd">
  <title>Prompt 库</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/attachments.css">
  <link rel="stylesheet" href="/taxonomy.css">
  <link rel="stylesheet" href="/reader.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div><div><strong>Prompt 库</strong></div></div>
      <div class="side-label">分类</div>
      <nav id="categories" aria-label="提示词分类"></nav>
      <div class="side-bottom"><div class="side-label">资料</div><button id="exportBtn" class="side-action">导出备份</button><button id="importBtn" class="side-action">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
    </aside>
    <main>
      <header class="topbar"><h1>提示词库</h1><div class="topbar-actions"><button id="taxonomyBtn" class="quiet" type="button">管理分类</button><button id="newBtn" class="primary" type="button">新增提示词</button></div></header>
      <div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索标题、正文或子类" autocomplete="off"></label><select id="subcategoryFilter" aria-label="子类筛选"><option value="all">全部子类</option></select><select id="statusFilter" aria-label="状态筛选"><option value="all">全部状态</option><option value="active">可使用</option><option value="reference">历史参考</option><option value="archived">已归档</option></select></div>
      <div class="section-line"><h2 id="viewTitle">全部提示词</h2><span id="resultCount"></span></div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" hidden><strong>没有匹配的提示词</strong></div>
    </main>
  </div>
  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle"><div class="dialog-head"><div><span id="detailCategory" class="eyebrow"></span><h2 id="detailTitle"></h2></div><button class="icon-close" data-close="detailDialog" aria-label="关闭">×</button></div><p id="detailStatus" class="detail-status" hidden></p><div class="reader-switch" role="group" aria-label="正文查看方式"><button id="renderedViewBtn" type="button" class="active" aria-pressed="true">排版阅读</button><button id="rawViewBtn" type="button" aria-pressed="false">Markdown 原文</button></div><div id="detailBody" class="detail-body markdown-body"></div><pre id="detailRaw" class="detail-body" hidden></pre><div id="attachments" class="attachments"></div><div class="dialog-actions"><button id="copyBtn" class="primary">复制原文</button><button id="editBtn" class="quiet">编辑提示词</button><button id="archiveBtn" class="quiet">归档</button></div></dialog>
  <dialog id="editDialog" class="edit-dialog" aria-labelledby="formTitle"><form id="promptForm"><div class="dialog-head"><h2 id="formTitle">新增提示词</h2><button type="button" class="icon-close" data-close="editDialog" aria-label="关闭">×</button></div><div class="form-grid"><label class="full">标题<input name="title" required maxlength="180"></label><label>大类<select name="category" id="categorySelect"></select></label><label>子类<select name="subcategory" id="subcategorySelect"></select></label><label>状态<select name="status"><option value="active">可使用</option><option value="reference">历史参考</option><option value="archived">已归档</option></select></label><label class="full">正文<textarea name="body" required rows="14"></textarea><input id="promptFile" type="file" accept=".md,.txt,text/plain,text/markdown" hidden><button id="choosePromptFile" type="button" class="quiet">从文件载入正文</button></label></div><div class="dialog-actions"><button type="button" class="quiet" data-close="editDialog">取消</button><button type="submit" class="primary">保存提示词</button></div></form></dialog>
  <dialog id="taxonomyDialog" class="edit-dialog" aria-labelledby="taxonomyTitle"><div class="dialog-head"><h2 id="taxonomyTitle">管理分类</h2><button class="icon-close" data-close="taxonomyDialog" aria-label="关闭">×</button></div><div id="taxonomyList" class="taxonomy-list"></div><form id="taxonomyAction" class="taxonomy-action" hidden><strong id="taxonomyActionTitle"></strong><p id="taxonomyActionHelp" hidden></p><label id="taxonomyNewNameLabel">新名称<input name="name" maxlength="80"></label><label id="taxonomyTargetCategoryLabel">目标大类<select name="target_category" id="taxonomyTargetCategory"></select></label><label id="taxonomyTargetSubcategoryLabel">目标子类<select name="target_subcategory" id="taxonomyTargetSubcategory"></select></label><div class="taxonomy-action-buttons"><button type="button" class="quiet" id="taxonomyCancel">取消</button><button type="submit" class="primary" id="taxonomyConfirm">确认</button></div></form><div class="taxonomy-add"><form id="categoryForm" class="taxonomy-form"><label>新增大类<input name="category" maxlength="40" required></label><button class="quiet" type="submit">添加</button></form><form id="subcategoryForm" class="taxonomy-form"><label>所属大类<select name="category" id="taxonomyCategory"></select></label><label>新增子类<input name="subcategory" maxlength="80" required></label><button class="quiet" type="submit">添加</button></form></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
