<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8fd">
  <title>Prompt 管理器</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/attachments.css">
  <link rel="stylesheet" href="/taxonomy.css">
  <link rel="stylesheet" href="/reader.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div><div><strong>Prompt 管理器</strong></div></div>
      <div class="side-label">分类</div>
      <nav id="categories" aria-label="Prompt 分类"></nav>
      <div class="side-bottom"><div class="side-label">资料</div><button id="exportBtn" class="side-action">导出备份</button><button id="importBtn" class="side-action">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
    </aside>
    <main>
      <header class="topbar"><h1>我的 Prompt</h1><div class="topbar-actions"><button id="taxonomyBtn" class="entry-button" type="button">管理分类</button><button id="newBtn" class="entry-button" type="button">新增 Prompt</button></div></header>
      <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索 Prompt" placeholder="搜索标题、正文或子类" autocomplete="off"></label><select id="subcategoryFilter" aria-label="子类筛选"><option value="all">全部子类</option></select><select id="statusFilter" aria-label="状态筛选"><option value="all">全部状态</option><option value="active">可使用</option><option value="reference">历史参考</option><option value="archived">已归档</option></select></div>
      <div class="section-line"><h2 id="viewTitle">全部 Prompt</h2><span id="resultCount"></span></div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" hidden><strong>没有匹配的 Prompt</strong></div>
    </main>
  </div>
  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle"><div class="dialog-head"><div><span id="detailCategory" class="eyebrow"></span><h2 id="detailTitle"></h2></div><button class="icon-close" data-close="detailDialog" aria-label="关闭">×</button></div><p id="detailStatus" class="detail-status" hidden></p><div class="reader-switch" role="group" aria-label="正文查看方式"><button id="renderedViewBtn" type="button" class="active" aria-pressed="true">阅读</button><button id="rawViewBtn" type="button" aria-pressed="false">原文</button></div><div id="detailBody" class="detail-body markdown-body"></div><pre id="detailRaw" class="detail-body" hidden></pre><div id="attachments" class="attachments"></div><div class="dialog-actions"><button id="deleteBtn" class="danger-outline">删除 Prompt</button><button id="editBtn" class="quiet">编辑 Prompt</button><button id="archiveBtn" class="quiet">归档</button><button id="copyBtn" class="primary">复制 Prompt</button></div></dialog>
  <dialog id="deleteDialog" class="confirm-dialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogHelp"><h2 id="deleteDialogTitle">删除 Prompt</h2><p id="deletePromptTitle"></p><p id="deleteDialogHelp">这条 Prompt 将从本机永久删除，仅能从已有备份恢复。关联附件不会删除。</p><div class="dialog-actions"><button type="button" class="quiet" data-close="deleteDialog">取消</button><button type="button" class="danger" id="confirmDeleteBtn">永久删除</button></div></dialog>
  <dialog id="editDialog" class="edit-dialog" aria-labelledby="formTitle"><form id="promptForm"><div class="dialog-head"><h2 id="formTitle">新增 Prompt</h2><button type="button" class="icon-close" data-close="editDialog" aria-label="关闭">×</button></div><div class="form-grid"><label class="full">标题<input name="title" required maxlength="180"></label><label>大类<select name="category" id="categorySelect"></select></label><label>子类<select name="subcategory" id="subcategorySelect"></select></label><label>状态<select name="status"><option value="active">可使用</option><option value="reference">历史参考</option><option value="archived">已归档</option></select></label><label class="full">正文<textarea name="body" required rows="14"></textarea><input id="promptFile" type="file" accept=".md,.txt,text/plain,text/markdown" hidden><button id="choosePromptFile" type="button" class="quiet">从 .md 或 .txt 文件载入正文</button></label></div><div class="dialog-actions"><button type="button" class="quiet" data-close="editDialog">取消</button><button type="submit" class="primary">保存 Prompt</button></div></form></dialog>
  <dialog id="taxonomyDialog" class="taxonomy-dialog" aria-labelledby="taxonomyTitle">
    <div class="dialog-head"><h2 id="taxonomyTitle">管理分类</h2><button class="icon-close" data-close="taxonomyDialog" aria-label="关闭">×</button></div>
    <div class="taxonomy-layout">
      <section class="taxonomy-column taxonomy-column--categories" aria-labelledby="taxonomyCategoryHeading">
        <div class="taxonomy-column-head"><h3 id="taxonomyCategoryHeading">大类</h3><button type="button" class="quiet taxonomy-add-button" id="addCategoryBtn">新增大类</button></div>
        <div id="taxonomyList" class="taxonomy-list"></div>
        <form id="categoryForm" class="taxonomy-form" hidden><label>大类名称<input name="category" maxlength="40" required></label><div class="taxonomy-form-actions"><button type="button" class="quiet" data-cancel-add="category">取消</button><button class="primary" type="submit">保存大类</button></div></form>
      </section>
      <section class="taxonomy-column taxonomy-column--subcategories" aria-labelledby="taxonomySubcategoryHeading">
        <div class="taxonomy-column-head"><h3 id="taxonomySubcategoryHeading">子类</h3><button type="button" class="quiet taxonomy-add-button" id="addSubcategoryBtn">新增子类</button></div>
        <div id="taxonomySublist" class="taxonomy-sublist"></div>
        <form id="subcategoryForm" class="taxonomy-form" hidden><label>子类名称<input name="subcategory" maxlength="80" required></label><input name="category" id="taxonomyCategory" type="hidden"><div class="taxonomy-form-actions"><button type="button" class="quiet" data-cancel-add="subcategory">取消</button><button class="primary" type="submit">保存子类</button></div></form>
        <form id="taxonomyAction" class="taxonomy-action" hidden><strong id="taxonomyActionTitle"></strong><p id="taxonomyActionHelp" hidden></p><label id="taxonomyNewNameLabel">新名称<input name="name" maxlength="80"></label><label id="taxonomyTargetCategoryLabel">目标大类<select name="target_category" id="taxonomyTargetCategory"></select></label><label id="taxonomyTargetSubcategoryLabel">目标子类<select name="target_subcategory" id="taxonomyTargetSubcategory"></select></label><div class="taxonomy-action-buttons"><button type="button" class="quiet" id="taxonomyCancel">取消</button><button type="submit" class="primary" id="taxonomyConfirm">确认</button></div></form>
      </section>
    </div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
